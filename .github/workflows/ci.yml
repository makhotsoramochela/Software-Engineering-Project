name: C++ CI

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake cppcheck
      - name: Configure CMake
        run: cmake -S lms -B lms/build
      - name: Build
        run: cmake --build lms/build
      - name: Run tests
        run: ctest --test-dir lms/build --output-on-failure
      - name: Static Analysis
        run: cppcheck --enable=all --inconclusive --std=c++17 lms/src
